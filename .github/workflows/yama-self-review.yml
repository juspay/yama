# Yama dogfoods itself: reviews juspay/yama's own PRs using the local action.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   - YAMA_GITHUB_TOKEN : a GitHub PAT (repo / pull_requests scope) for the
#                         hosted GitHub MCP endpoint (api.githubcopilot.com)
#   - LITELLM_BASE_URL  : LiteLLM proxy base URL
#   - LITELLM_API_KEY   : LiteLLM proxy API key
# Until all three are set, the preflight job skips the review (the check stays green).
name: Yama Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: yama-self-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege at the workflow level; only the review job is granted
# pull-requests: write (it posts the review). preflight just reads.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PAT: ${{ secrets.YAMA_GITHUB_TOKEN }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          if [ -n "$PAT" ] && [ -n "$LITELLM_BASE_URL" ] && [ -n "$LITELLM_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Yama self-review skipped — set repo secrets YAMA_GITHUB_TOKEN, LITELLM_BASE_URL and LITELLM_API_KEY to enable."
          fi

  review:
    needs: preflight
    # Run only when secrets are configured and the PR is from this repo (forks
    # have no access to secrets, so preflight already skips them).
    if: >-
      needs.preflight.outputs.enabled == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Needed to download the previous run's review-state artifact.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Serena (code-intelligence MCP) launches via `uvx`, so `uv` must be on
      # PATH before the review runs. The composite action inherits the runner
      # PATH, so installing it here makes `uvx` available to the serena server.
      - name: Set up uv (for the Serena MCP server)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # Cross-run review state (github-artifact store): restore the newest
      # state artifact for this PR so the review is incremental — previously
      # posted findings are never duplicated, fixed ones get resolved.
      - name: Restore review state
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          NAME="yama-state-pr-${PR}"
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=1"             --jq '.artifacts[0].id' 2>/dev/null || true)"
          if [ -n "${ART_ID}" ] && [ "${ART_ID}" != "null" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/yama-state.zip
            mkdir -p .yama/state
            unzip -o /tmp/yama-state.zip -d .yama/state && echo "Restored ${NAME}" || echo "State artifact unreadable — starting fresh"
          else
            echo "No previous state artifact — first review of this PR"
          fi
      - name: Yama Review
        # `uses: ./` runs the action from THIS checkout — required to bootstrap the
        # action (it doesn't exist on `main` until this PR merges). The job is gated
        # to same-repo PRs (forks, which can't read secrets, are skipped), so only
        # trusted collaborators reach it. After merge, pin this to the published
        # action at a fixed ref (e.g. juspay/yama@<sha>) so PR-modified action code
        # can't run with secrets.
        uses: ./
        with:
          github-token: ${{ secrets.YAMA_GITHUB_TOKEN }}
          ai-provider: litellm
          # Empirically validated (run 29823266055): the CI LiteLLM key caps
          # "external paid models" at $5/month, so claude/gemini models are
          # rejected; its FREE internal set is the glm/kimi family. Also,
          # gemini-2.5-flash function calls break in LiteLLM's Vertex adapter
          # (thoughtSignature parsing). To run sonnet+gemini-flash in CI, add
          # Vertex credentials (google-application-credentials input) — that
          # combination is validated end-to-end locally on Vertex direct.
          # private-large for both roles — tool calling verified locally via
          # the proxy (free internal model on this key class).
          ai-model: private-large
          explore-model: private-large
          litellm-base-url: ${{ secrets.LITELLM_BASE_URL }}
          litellm-api-key: ${{ secrets.LITELLM_API_KEY }}
          focus-areas: security,performance,codeQuality
          # Review only (skip PR-description enhancement) — the reviewer posts
          # inline comments + a verdict; it does not rewrite PR descriptions.
          skip-description-enhance: "true"
      # Persist review state for the next push on this PR (incremental review).
      - name: Save review state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yama-state-pr-${{ github.event.pull_request.number }}
          path: .yama/state/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
