name: Yama learn

# The merge event is the ONLY trigger that reliably identifies which pull
# request merged. This repository rebases, so commits carry no pull request
# number and a `push` trigger would attribute feedback to the wrong pull
# request — or to none.
#
# There is deliberately no paths-ignore here. The loop guard for this workflow is
# the actor condition below plus `[skip ci]` on the commit learn makes; a learn
# commit goes straight to the default branch and never opens a pull request, so it
# cannot re-trigger this event at all. The paths-ignore that matters lives on CI's
# push trigger, where a learn commit DOES land.
on:
  pull_request:
    types: [closed]
  # Recovery lever: a learn run that failed for an environmental reason (a missing
  # runner dependency, an outage) can be re-run for the same pull request without
  # waiting for another merge. The merged-and-not-bot guard the closed trigger
  # enforces is re-checked by the job's own verify step below, so a dispatch cannot
  # aim the write job at an unmerged or bot-authored pull request; and learn refuses
  # to run off its own commit, so a re-run cannot feed itself back in.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to learn from (must be merged)"
        required: true
        type: string

# Serialised: two learn runs would race each other pushing to main, and the
# loser would be rebased onto a knowledge base it never read.
concurrency:
  group: yama-learn
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  # The review run's artifact is located through the artifacts API.
  actions: read

jobs:
  learn:
    # Only a MERGED pull request teaches anything. A closed-unmerged one was
    # rejected, and learning from it would record conventions nobody adopted.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify the dispatched pull request is merged and human-authored
        # The closed trigger's `if:` cannot see a dispatched run, so the SAME guard is
        # enforced here from the platform's own record before anything else happens —
        # learn writes the knowledge base every later review reads, and an unmerged or
        # bot-authored pull request must not get to write it from either trigger.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          merged=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merged')
          author=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')
          if [ "$merged" != "true" ]; then
            echo "::error::pull request #${PR_NUMBER} is not merged — learn only learns from merged work"
            exit 1
          fi
          if [ "$author" = "github-actions[bot]" ]; then
            echo "::error::pull request #${PR_NUMBER} is bot-authored — refusing the self-feed loop"
            exit 1
          fi
          echo "pull request #${PR_NUMBER} is merged and authored by ${author} — proceeding"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Named, not detached: learn refuses to commit on a detached HEAD, and a
          # pull_request checkout is detached by default.
          ref: main
          # Correction linking walks history to connect a fix back to what it
          # fixed, which is the signal that makes the impact ledger useful.
          fetch-depth: 0
          # The WORKFLOW token is the push credential: this job declares
          # `contents: write`, and the learn commit's [skip ci] plus CI's
          # paths-ignore break the loop. YAMA_GITHUB_TOKEN is the API/MCP read
          # credential only — it has no push access to this repository, and the
          # first production learn died pushing with it (403).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Version comes from `packageManager` in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Restore the pull request's run store
        # What the reviews on this pull request established. Learning promotes
        # from it into the repository knowledge base — the impact ledger entry
        # comes from here — and then discards the rest.
        #
        # Located through the API, not `actions/download-artifact` by name: that
        # action only sees artifacts from the CURRENT workflow run, and the
        # artifact this needs was written by the REVIEW run on the pull request.
        # Using it here downloaded nothing, silently, on every merge — so the
        # impact log was never written and nobody could tell.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          name="yama-pr-${PR_NUMBER}"
          id=$(gh api "repos/${REPOSITORY}/actions/artifacts?per_page=100" \
                 --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false)]
                       | sort_by(.created_at) | reverse | .[0].id // empty")
          if [ -z "$id" ]; then
            echo "No review store for this pull request — learning from its comments alone."
            exit 0
          fi
          mkdir -p .yama/artifacts
          gh api "repos/${REPOSITORY}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/yama-store.zip"
          unzip -o -q "$RUNNER_TEMP/yama-store.zip" -d .yama/artifacts
          echo "Restored the review store from artifact $id."

      - name: Set the commit identity
        # Yama shells out to plain `git commit`; it never passes an author of its
        # own, on purpose — the identity a repository's agent commits under is the
        # repository's decision, not the tool's. A runner has no git identity
        # configured, so without this the commit fails at the very end, after the
        # whole triage has been paid for.
        #
        # This identity is also what the actor guards above and on the review
        # workflow match, which is what stops a learn commit feeding itself back in.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup uv (code-review-graph server)
        # .yama/mcp.yaml declares the graph server; doctor proves every declared
        # server and exits 2 on one it cannot spawn. The review job carries these
        # same two steps — learn needs them for the same reason.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Warm the code-review-graph package
        run: uvx --from code-review-graph==2.3.7 code-review-graph --help >/dev/null 2>&1 || echo "warm failed — doctor will say what that means"

      - name: Verify the write path
        # Proves the config, the connections and the credentials BEFORE computing
        # anything. Discovering at push time that the bot cannot write loses the
        # feedback from this pull request permanently.
        env:
          YAMA_GITHUB_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          # The GitHub MCP server reads its credential from GITHUB_TOKEN (see the
          # server block in .yama/mcp.yaml).
          GITHUB_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_ENABLED: "true"
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # On dispatch the event has no PR payload; the base comes from the PR record
          # itself, so a PR merged into a non-default base still learns against it.
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')
          fi
          node dist/cli/index.js doctor \
            --pr "$PR_NUMBER" \
            --base "origin/$BASE_REF"

      - name: Learn
        # A refused or failed write exits non-zero, so a silent no-op cannot pass
        # for a successful learn.
        env:
          YAMA_GITHUB_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.YAMA_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_ENABLED: "true"
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          node dist/cli/index.js learn \
            --pr "$PR_NUMBER"
