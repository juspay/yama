# Yama configuration for the Yama (pr-guardian) repo itself.
# Everything is config-driven — MCP servers, tool filtering, model, standards.
version: 2
configType: "yama"

ai:
  # Local runs use Vertex (GOOGLE_APPLICATION_CREDENTIALS / project / location in .env).
  provider: "vertex"
  model: "claude-sonnet-4-6"
  temperature: 0.2
  maxTokens: 32000
  # Caps the WHOLE agentic review loop (all tool-call steps) in one generate()
  # call. Slow self-hosted models (litellm/glm) need headroom; keep this in
  # sync with performance.maxReviewDuration.
  timeout: "15m"
  retryAttempts: 3
  explore:
    enabled: true
    provider: "vertex"
    model: "gemini-2.5-flash"
    temperature: 0.1
    maxTokens: 16000
    timeout: "5m"
    cacheResults: true

# All MCP servers are config entries. Secrets come from the environment via ${VAR}.
# blockedTools = denylist; allowedTools = fail-closed read-only allowlist.
mcpServers:
  servers:
    # GitHub MCP (remote, HTTP) — used by the CI self-review to read the PR/diff
    # and post inline comments. PR mode only; authenticates via ${GITHUB_TOKEN}
    # (the action sets it from the github-token input). Destructive/repo-write
    # tools are denylisted so the reviewer can only read + comment + set status.
    github:
      enabled: true
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        # Non-reserved env name forwarded by the action (see action.yml). Using
        # ${GITHUB_TOKEN} here is unreliable inside a composite action.
        Authorization: "Bearer ${YAMA_GITHUB_TOKEN}"
      roles: [review, explore]
      modes: [pr]
      # The hosted endpoint is slow to connect (TLS + lazy tool discovery); a
      # generous timeout + retry/backoff prevents spurious "not connected"
      # failures on the first GitHub tool call.
      timeout: 30000
      retryConfig:
        maxAttempts: 3
        initialDelay: 1000
        maxDelay: 10000
        backoffMultiplier: 2
      blockedTools:
        - push_files
        - create_or_update_file
        - create_branch
        - delete_file
        - merge_pull_request
    local-git:
      enabled: true
      transport: stdio
      command: npm
      args: ["run", "-s", "mcp:git:server"]
      roles: [review, explore]
      modes: [local]
      allowedTools:
        - git_status
        - git_log
        - git_show
        - git_diff
        - git_diff_staged
        - git_diff_unstaged
        - git_blame
    serena:
      # Code intelligence for TypeScript (LSP-backed). Serena needs its
      # onboarding + read tools, so we DENYLIST only the mutating/shell tools
      # (keeps it read-only without breaking project activation).
      enabled: true
      transport: stdio
      command: uvx
      args:
        - "--from"
        - "git+https://github.com/oraios/serena"
        - "serena"
        - "start-mcp-server"
        - "--context"
        - "ide-assistant"
      roles: [review, explore]
      modes: [pr, local]
      blockedTools:
        - create_text_file
        - replace_symbol_body
        - insert_after_symbol
        - insert_before_symbol
        - replace_regex
        - replace_lines
        - delete_lines
        - insert_at_line
        - execute_shell_command
        - write_memory
        - delete_memory

# Cross-run review state: the github-artifact store is a file store whose
# artifact transport is handled by the workflow (restore/upload steps in
# yama-self-review.yml). Locally it behaves exactly like the file store.
state:
  enabled: true
  store: github-artifact
  path: .yama/state

review:
  enabled: true
  # submit_review gate: tools-off critic pass before anything is posted.
  verification: basic
  contextLines: 3
  maxFilesPerReview: 50
  fileAnalysisTimeout: "2m"
  focusAreas:
    - name: "Security"
      priority: "CRITICAL"
      description: "Injection, secret handling, unsafe deserialization, SSRF, RCE, auth flaws."
    - name: "Correctness"
      priority: "MAJOR"
      description: "Logic bugs, wrong error handling, race conditions, broken control flow."
    - name: "Config-driven design"
      priority: "MAJOR"
      description: "No hardcoded tool names, URLs, or provider special-casing — behaviour must come from config. Flag any tool/type hardcoded in code."
    - name: "Types & API"
      priority: "MINOR"
      description: "Avoid `any` on public surfaces; keep exports and config types coherent."
    - name: "Tests"
      priority: "MINOR"
      description: "New behaviour has focused tests; pure logic is unit-tested."
  excludePatterns:
    - "dist/**"
    - "node_modules/**"
    - "**/*.snap"
    - "pnpm-lock.yaml"

descriptionEnhancement:
  enabled: true

memoryBank:
  enabled: true
  path: ".yama/standards"
  fallbackPaths: ["memory-bank"]

projectStandards:
  customPromptsPath: ".yama/prompts/"
  additionalFocusAreas: []
  customBlockingRules: []
  severityOverrides: {}
