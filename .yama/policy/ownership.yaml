# Ownership.
#
# One maintainer today, so one rule covering the repository. Non-blocking: it
# tags for visibility rather than gating merges. Set `blocking: true` on a rule
# when you want an unapproved change to fail the verdict.
rules:
  - id: repo
    paths: ["**"]
    owners: ["@pdogra1299"]
    minApprovals: 1
    blocking: false
    reason: "Default reviewer for the repository"
