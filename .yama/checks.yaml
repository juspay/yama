# Commands Yama may run as evidence while reviewing this repository.
#
# SECURITY, and not tunable downward: this file and every script it names are read from the
# BASE branch, never from the change under review — a pull request does not get to
# introduce the command that reviews it. If the head modifies this file every check is
# refused; if it modifies a script a check names, that one check is refused by name.
#
# Commands are argv arrays, never shell strings: no pipes, no globs, no `&&`.

version: 1

checks:
  # Compiles src/ and test/ and emits nothing. This is the check that catches a change
  # breaking a file it did not touch.
  - id: typecheck
    command: ["pnpm", "run", "check"]
    timeoutMs: 300000

  # The rulings the repository enforces mechanically — the type-location rules, the engine
  # seam, no `interface`, no double assertion. A lint error here is a ruling broken, which
  # is why this one is not optional.
  - id: lint
    command: ["pnpm", "run", "lint"]
    timeoutMs: 300000

  # The end-to-end suites. Optional because they drive the BUILT CLI: on a runner that has
  # not built dist/ yet the failure is the harness, not the change, and a review must not
  # report that as a defect. A failure that is real is still evidence, and the agent reads
  # it as such.
  - id: test
    command: ["pnpm", "test"]
    optional: true
    timeoutMs: 600000
