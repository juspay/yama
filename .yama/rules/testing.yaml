rules:
  - id: test.new-modules-ship-with-tests
    title: New modules ship with tests
    summary: >
      Pure logic — gate, verdict, parsers, config, policy — is unit tested without
      network. Matrix behaviour is table-driven.
    domain: testing
    paths: ["src/v4/**/*.ts"]
    severity: MINOR
    status: active

  - id: test.assert-behaviour-not-shape
    title: Test what the code guarantees, not how it is written
    summary: >
      Assert the invariant a reader would care about. A test that pins an internal
      shape breaks on every refactor and protects nothing.
    domain: testing
    paths: ["tests/**/*.ts"]
    severity: MINOR
    status: active
