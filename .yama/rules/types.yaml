# Type-system conventions. These are the ones a newcomer cannot infer from the
# code, and that a linter does not already enforce end to end.
rules:
  - id: types.no-interface
    title: Use `type`, never `interface`
    summary: Declare types with `type X = { ... }` and compose with `&`, not `extends`.
    domain: typescript
    paths: ["src/**/*.ts"]
    severity: MINOR
    status: active
    example: |
      // no
      interface ReviewResult extends BaseResult { decision: string }
      // yes
      type ReviewResult = BaseResult & { decision: string };
    aliases: ["interface", "extends"]

  - id: types.canonical-location
    title: Exported types live in the types folder
    summary: >
      Every exported type belongs in src/v4/types/. Never create a types file or
      folder inside a feature directory, and never export a type from a feature
      module. Non-exported helper types local to one file are fine.
    domain: typescript
    paths: ["src/**/*.ts"]
    severity: MAJOR
    status: active
    aliases: ["type location", "types folder"]

  - id: types.no-suffix
    title: Type filenames carry no "types" suffix
    summary: The folder is already the types folder — `config.ts`, not `config.types.ts`.
    domain: typescript
    paths: ["src/v4/types/**"]
    severity: MINOR
    status: active

  - id: types.unique-names
    title: Exported type names are globally unique
    summary: >
      The types barrel re-exports everything, so two identically-named exported
      types collide. Disambiguate with a domain prefix.
    domain: typescript
    paths: ["src/v4/types/**"]
    severity: MAJOR
    status: active
    example: |
      // collides across domains
      type ServerConfig = { ... }
      // disambiguated
      type McpServerConfig = { ... }

  - id: types.barrel-only-imports
    title: Import internal types from the barrel
    summary: >
      Code outside src/v4/types/ imports internal types from "../types/index.js"
      only, never from a specific type file. Files inside the types folder import
      each other directly. External library types import normally.
    domain: typescript
    paths: ["src/**/*.ts"]
    severity: MINOR
    status: active

  - id: types.barrel-export-star
    title: The types barrel contains only `export *` lines
    summary: >
      No selective exports and no aliases in src/v4/types/index.ts. A name
      collision is fixed at its source, not papered over in the barrel.
    domain: typescript
    paths: ["src/v4/types/index.ts"]
    severity: MAJOR
    status: active
