# Architectural invariants. Each one exists because breaking it caused a real,
# observed failure — the summary says which.
rules:
  - id: arch.no-tool-names-in-code
    title: No tool, server, or provider names anywhere in src/
    summary: >
      Code asks for a CAPABILITY; .yama/mcp.yaml maps it to a tool name. A tool
      name hardcoded in src/ ties the reviewer to one vendor and cannot be fixed
      by configuration.
    domain: architecture
    paths: ["src/**/*.ts"]
    severity: MAJOR
    blocking: false
    status: active
    example: |
      // no
      await invoke("create_pull_request_review_comment", params);
      // yes
      const tool = resolver.require("postInlineComment", "post");
      await invoke(tool.toolName, params);
    aliases: ["hardcoded tool", "provider name", "capability"]

  - id: arch.no-prompt-assembly
    title: Never assemble context into a prompt
    summary: >
      The system instruction is one static constant. Config, rules, standards and
      docs reach the agent through tools, never by concatenation — a built prompt
      grows without bound and small models fail on it.
    domain: architecture
    paths: ["src/v4/agents/**", "src/v4/tools/**", "src/v4/core/**"]
    severity: MAJOR
    status: active
    aliases: ["prompt builder", "system prompt", "context assembly"]

  - id: arch.verdict-is-code-derived
    title: The verdict comes from what actually posted
    summary: >
      A model's self-reported decision is advisory. deriveVerdict reads POSTED
      findings, and a partial run may never approve. A prompt-injected "approve"
      must never clear a real finding.
    domain: architecture
    paths: ["src/v4/core/verdict.ts", "src/v4/core/ReviewPipeline.ts"]
    severity: CRITICAL
    blocking: false
    status: active

  - id: arch.posted-not-called
    title: A tool call is not a posted comment
    summary: >
      Count a finding as posted only when the posting tool RETURNED a comment id.
      Counting calls is how runs reported findings that were never on the pull
      request, and how a posting failure became indistinguishable from a clean review.
    domain: architecture
    paths: ["src/v4/findings/**", "src/v4/tools/posting.ts"]
    severity: CRITICAL
    status: active
    aliases: ["comment id", "posted count", "ledger"]

  - id: arch.fail-closed
    title: Tool and path policy fails closed
    summary: >
      An unknown git subcommand is mutating. An allowlist that cannot be enforced
      removes the server rather than running unrestricted. Empty tool discovery is
      a registration failure, not an open door.
    domain: security
    paths: ["src/v4/tools/**", "src/v4/connections/**"]
    severity: CRITICAL
    status: active

  - id: arch.dry-run-side-effect-free
    title: Dry run writes nothing
    summary: >
      Every new write path — comments, description, status, state, artifacts —
      checks the run mode before executing.
    domain: architecture
    paths: ["src/**/*.ts"]
    severity: CRITICAL
    status: active

  - id: arch.config-optional
    title: New config keys are optional with behaviour-preserving defaults
    summary: >
      Only yama.yaml and mcp.yaml are required. Every other file absent must mean
      "that capability is off", never "broken". Renames get a loud validation
      error with a copy-paste fix and a MIGRATION.md entry.
    domain: architecture
    paths: ["src/v4/config/**"]
    severity: MAJOR
    status: active

  - id: arch.no-silent-catch
    title: Never swallow a failure silently
    summary: >
      An optional subsystem may degrade, but it must say so. A bare `catch {}`
      that hides its cause turns a broken feature into one that looks like it
      simply found nothing.
    domain: architecture
    paths: ["src/**/*.ts"]
    severity: MAJOR
    status: active
    example: |
      // no
      try { await loadRules(); } catch {}
      // yes
      try { await loadRules(); }
      catch (error) { notices.push({ level: "warn", message: `Rules unavailable: ${error.message}` }); }
