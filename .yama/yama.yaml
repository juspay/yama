# Yama reviews its own pull requests with this configuration.
#
# It is also the reference `.yama/yama.yaml`: everything here is a real setting on a real
# repository, not an illustration. `templates/yama.yaml` is the annotated starting point
# `yama init` scaffolds — this file is what one looks like once it has been decided.

version: 1

# Every model slot is a FALLBACK CHAIN. A scalar broadcasts across the whole chain, an
# array gives one value per link, and the links are tried in order until one answers.
#
#   main       drives the review itself — WarmUp, the checklist, Collate, Delivery
#   worker     runs delegated investigations; falls back to `main` when unset
#   summarizer falls back to `worker`
#
# The provider is `litellm` for both roles: the gateway this repository's CI points
# LITELLM_BASE_URL at, authenticated with LITELLM_API_KEY. Both members of the chain serve
# tool calling there, which is the one thing a stage cannot do without — a member that
# answers in prose but cannot call a tool cannot read a diff, so it is not a fallback.
# `deepseek` is the fallback because it is the independent second path on that gateway:
# when the first is rate-limited or down, the review continues rather than stopping.
#
# Every model call in Yama is schema-bound (structured output on the turn), so a member
# that returns something that does not validate fails and the chain advances — it never
# becomes an empty stage result.
models:
  main:
    provider: litellm
    model: [open-fast, deepseek]
  worker:
    provider: litellm
    model: [open-fast, deepseek]
  # Summarizing the conversation has a HARDCODED 60-second ceiling inside the engine, and
  # a summary that misses it evicts nothing at all. So this role gets the fast model and
  # no slow fallback: a summarizer that is merely thorough is a summarizer that times out.
  summarizer:
    provider: litellm
    model: open-fast

# How many delegated workers may run at once: low = 1, medium = 3, high = 6.
# Medium: this repository's pull requests fan out to a handful of investigations, and the
# gateway above is shared with other jobs — a wider pool buys latency at its expense.
pool:
  tier: medium

# The run's own short-term memory: what one stage said, still there for the next one.
#
# ON, and it has to be. A stage is one `generate()` call, so without this every stage,
# every schema retry and every nudge round starts from nothing — which is how a review of
# a 15-file change once retried twice, forgot both attempts, and answered "the change
# details were not retrieved". It is also what lets the reviewer improve inside a run:
# a correction handed back to it is only a correction if it remembers what it did.
#
# Eviction is the whole game: a summarization that does not finish evicts NOTHING and
# returns, so the history stops being trimmed and grows until the context window ends the
# run. Two settings decide whether it finishes — how much is summarized at once
# (`tokenThreshold`, since the engine keeps 30% recent and summarizes the rest) and how
# long it may take (`summarizeTimeoutMs`). Measured here at 32k and again at 16k, the
# RE-reviews timed out either way (6 and 5 times) while the first review of the same branch
# did not, which is what showed the ceiling was the binding half. Summarization runs on the
# `summarizer` chain above, never the engine's own Vertex default, which this deployment
# holds no credential for.
memory:
  enabled: true
  summarize: true
  tokenThreshold: 16000
  # The engine's own ceiling is 60s, which is a guess about somebody else's gateway. A
  # single call here routinely takes minutes, and an abandoned summary evicts NOTHING.
  summarizeTimeoutMs: 120000

# Post-merge knowledge update (`yama learn --pr N`). This is the only command in Yama that
# ever changes the repository, and it is ON here deliberately: Yama's own review history is
# where its memory format gets proven.
#
# It reads the merged pull request's discussion, works out what the reviewers actually
# decided, and writes one Markdown file per fact under .yama/memory/ — which every later
# review reads during WarmUp. Only .yama/ is ever staged, verified by reading the staged
# set back out of git; the subject carries [skip ci] so the commit cannot re-trigger CI;
# and there is no force push. Credentials reach git from the environment
# (YAMA_GITHUB_TOKEN): a remote URL carrying a token in it is refused rather than used.
learn:
  enabled: true
  # Where the knowledge lives, relative to .yama/. Committed, unlike artifacts/.
  memoryDir: memory
  # CI checks a pull request out DETACHED, so the branch the merge landed on is named
  # here rather than read off HEAD.
  branch: main
  commitPrefix: "chore(yama): "
  skipCiToken: "[skip ci]"
  remote: origin
  # Publishing is not as easy to undo as committing. On, because a memory that only ever
  # exists on a CI runner is not a memory.
  push: true

# What Delivery is allowed to put on a pull request. Each action also needs its capability
# mapped in mcp.yaml; an action whose capability is missing is switched off and named in
# the run report, never silently skipped.
delivery:
  # One comment per finding, on the line it is about, carrying its dedup marker.
  inlineComments: true
  # One comment per run: what was reviewed, what was found, and the decision.
  summaryComment: true
  # The verdict is DELIVERED as the pull request's review state — BLOCK arrives as a
  # request-changes review, visible and dismissible where reviewers look, gateable by
  # branch protection. The CI job stays green on a BLOCK (the review workflow treats
  # exit 1 as a delivered outcome); a red check is reserved for a run that BROKE
  # (config error, crash). The exit-code contract itself is unchanged for CIs that
  # prefer to gate on it.
  verdict: true
  # Description enhancement. Yama writes only inside its own fenced block and never touches
  # a word the author wrote — but the pull request description here is written by the
  # single-commit policy's own template, so leave it alone.
  describe: false
  # Which sections that block would carry if `describe` were on.
  describeSections: [summary, risk]
  maxInlineComments: 25
  minSeverity: MINOR

# The verdict policy: a pure function of the open findings and this block, so what a run
# decided is auditable from configuration alone. A model's self-reported "approve" cannot
# clear a blocking finding, and a run that did not finish its checklist never approves.
verdict:
  blockOn: [CRITICAL]
  commentOn: [MAJOR]
  # Findings below this confidence are noise and never move the verdict. 0 while the
  # confidence numbers this repository's reviews produce are still being calibrated.
  minConfidence: 0
  # Block once this many commentOn findings pile up. 0 disables the threshold.
  blockAfter: 0
