# Yama Configuration Example
# Copy this file to yama.config.yaml and customize for your project

version: 2
configType: "yama"

# ============================================================================
# Display & Streaming Configuration
# ============================================================================
display:
  showBanner: true # Show Yama banner on startup
  streamingMode: false # Enable real-time streaming of AI decisions
  verboseToolCalls: false # Log every MCP tool call
  showAIThinking: false # Display AI reasoning process

# ============================================================================
# AI Configuration
# ============================================================================
ai:
  provider: "auto" # auto | google-ai | anthropic | openai | bedrock
  model: "gemini-2.5-pro" # or claude-3-7-sonnet-20250219-v1:0, gpt-4, etc.
  temperature: 0.2 # Lower = more deterministic (0.0-1.0)
  maxTokens: 128000 # Maximum tokens per AI call
  enableAnalytics: true # Track token usage and costs
  enableEvaluation: false # Enable quality evaluation (slower)
  timeout: "15m" # Maximum time for review
  retryAttempts: 3 # Total generate attempts on transient errors (initial + retries)

  # Conversation memory for maintaining review state
  conversationMemory:
    enabled: true
    store: "memory" # memory | redis
    maxSessions: 50
    maxTurnsPerSession: 300 # Long reviews need many turns
    enableSummarization: false # Don't summarize mid-review

  # Explore worker configuration
  explore:
    enabled: true
    provider: "auto"
    model: "gemini-2.5-flash"
    temperature: 0.1
    maxTokens: 32000
    timeout: "5m"
    cacheResults: true

# ============================================================================
# MCP Servers Configuration
# ============================================================================
# EVERY MCP server is defined here — the code hardcodes none of them. Each entry
# is a full server definition. Secrets come from the environment via ${VAR}.
#   roles:        which agents get the server (review / explore). Default: both.
#   modes:        which review modes (pr / local). Default: both.
#   blockedTools: denylist — hide these tool names from the agent.
#   allowedTools: fail-closed allowlist — ONLY these tools are exposed.
# Everything else is forwarded to NeuroLink's addExternalMCPServer verbatim
# (after ${ENV} substitution, including nested values), so ANY MCP server kind
# NeuroLink supports works from config alone: transport stdio|http|sse|websocket,
# command/args/env, url/headers, timeout, retryConfig, auth (oauth2/bearer/
# api-key), httpOptions, rateLimiting — and future NeuroLink options too.
mcpServers:
  servers:
    bitbucket:
      enabled: true
      transport: stdio
      command: npx
      args: ["-y", "@nexus2520/bitbucket-mcp-server@latest"]
      env:
        BITBUCKET_USERNAME: ${BITBUCKET_USERNAME}
        BITBUCKET_TOKEN: ${BITBUCKET_TOKEN}
        BITBUCKET_BASE_URL: ${BITBUCKET_BASE_URL}
      roles: [review, explore]
      modes: [pr]
      # Destructive tools the review/enhance flow never needs. Comments,
      # approval, and update_pull_request are intentionally NOT blocked.
      blockedTools:
        - merge_pull_request
        - decline_pull_request
        - delete_branch
        - delete_comment
        - create_pull_request

    github:
      enabled: false
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
      roles: [review, explore]
      modes: [pr]
      blockedTools:
        - push_files
        - create_or_update_file
        - create_branch
        - delete_file
        - merge_pull_request

    local-git:
      enabled: true
      transport: stdio
      command: npm
      args: ["run", "-s", "mcp:git:server"]
      roles: [review, explore]
      modes: [local]
      # Read-only git inspection only.
      allowedTools:
        - git_status
        - git_log
        - git_show
        - git_diff
        - git_diff_staged
        - git_diff_unstaged
        - git_blame

    serena:
      # Code intelligence (LSP-backed) for review-beyond-the-diff. Needs uvx.
      enabled: false
      transport: stdio
      command: uvx
      args:
        [
          "--from",
          "git+https://github.com/oraios/serena",
          "serena",
          "start-mcp-server",
          "--context",
          "ide-assistant",
        ]
      roles: [review, explore]
      modes: [pr, local]
      # Read-only: block Serena's mutating/shell tools; keep onboarding + reads.
      blockedTools:
        - create_text_file
        - replace_symbol_body
        - insert_after_symbol
        - insert_before_symbol
        - replace_regex
        - replace_lines
        - delete_lines
        - insert_at_line
        - execute_shell_command
        - write_memory
        - delete_memory

# ============================================================================
# Review Configuration
# ============================================================================
review:
  enabled: true

  # High-level workflow instructions (combined with base system prompt)
  workflowInstructions: |
    Follow the autonomous review workflow:
    1. Read PR details
    2. Read project standards from memory-bank
    3. Analyze files one-by-one
    4. Search code for context as needed
    5. Comment on issues immediately
    6. Make final decision based on blocking criteria

  # Analysis focus areas (in priority order)
  focusAreas:
    - name: "Security Analysis"
      priority: "CRITICAL"
      description: |
        - SQL/NoSQL injection vulnerabilities
        - Cross-Site Scripting (XSS)
        - Authentication/Authorization flaws
        - Hardcoded secrets, API keys, passwords
        - Input validation and sanitization
        - Data exposure and privacy violations

    - name: "Performance Review"
      priority: "MAJOR"
      description: |
        - N+1 database query patterns
        - Memory leaks and resource management
        - Algorithm complexity issues
        - Missing caching opportunities
        - Blocking I/O in async contexts

    - name: "Code Quality"
      priority: "MAJOR"
      description: |
        - SOLID principle violations
        - Poor error handling
        - Code duplication (DRY violations)
        - Poor naming conventions
        - Missing edge case handling

  # Blocking criteria (OPTIONAL - AI uses these to decide whether to block PR)
  # If not provided or empty, AI will review and comment but NOT auto-block/approve PRs
  # Uncomment and customize the examples below to enable auto-blocking:
  blockingCriteria: []
  # blockingCriteria:
  #   - condition: "ANY CRITICAL severity issue"
  #     action: "BLOCK"
  #     reason: "Security or data loss risk"
  #
  #   - condition: "3 or more MAJOR severity issues"
  #     action: "BLOCK"
  #     reason: "Too many significant bugs/performance issues"
  #
  # Files to exclude from analysis
  excludePatterns:
    - "*.lock"
    - "*.svg"
    - "*.min.js"
    - "*.map"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"

  # Context settings
  contextLines: 3 # Lines of context around each diff change
  maxFilesPerReview: 100 # Maximum files to review
  fileAnalysisTimeout: "2m" # Timeout per file

  # Tool usage preferences
  toolPreferences:
    lazyLoading: true # Read files on-demand (RECOMMENDED)
    cacheToolResults: true # Cache MCP tool responses
    parallelToolCalls: false # Sequential for better context
    maxToolCallsPerFile: 20 # Prevent infinite loops
    enableCodeSearch: true # Allow search_code() usage
    enableDirectoryListing: true # Allow list_directory_content()

# ============================================================================
# PR Description Enhancement
# ============================================================================
descriptionEnhancement:
  enabled: true

  instructions: |
    Enhance the PR description using diff analysis.
    Generate comprehensive, well-structured description with all required sections.

  requiredSections:
    - key: "summary"
      name: "📋 Summary"
      required: true
      description: "Clear overview of what this PR accomplishes"

    - key: "changes"
      name: "🔧 Changes Made"
      required: true
      description: "Specific technical changes with file references"

    - key: "testing"
      name: "🧪 Testing Strategy"
      required: true
      description: "How changes were tested and validation approach"

    - key: "impact"
      name: "⚡ Impact & Considerations"
      required: false
      description: "Business impact, performance implications, breaking changes"

  preserveContent: true # Don't remove existing images/links/tables
  autoFormat: true # Clean up markdown formatting

# ============================================================================
# Memory Bank & Project Context
# ============================================================================
memoryBank:
  enabled: true
  path: "memory-bank"
  fallbackPaths:
    - "docs/memory-bank"
    - ".memory-bank"

  # Standard files to read for project context
  standardFiles:
    - "project-overview.md"
    - "architecture.md"
    - "coding-standards.md"
    - "security-guidelines.md"

# ============================================================================
# Knowledge Base - Reinforcement Learning from PR Feedback
# ============================================================================
# Yama learns from developer feedback on AI comments across merged PRs.
# Use 'yama learn -w <workspace> -r <repo> -p <pr-id>' to extract learnings.
knowledgeBase:
  enabled: true

  # Path to knowledge base file (relative to repo root)
  path: ".yama/knowledge-base.md"

  # Patterns to identify AI-generated comments (author name matching)
  aiAuthorPatterns:
    - "Yama"
    - "yama-bot"
    - "yama-review"

  # Automatically summarize knowledge base when entry count exceeds this
  maxEntriesBeforeSummarization: 50

  # How many consolidated entries to keep after summarization
  summaryRetentionCount: 20

  # Automatically commit knowledge base changes (with --commit flag)
  autoCommit: false

# Per-repo condensed memory
# Memory accumulates durable facts about each repository across reviews
memory:
  enabled: true
  storagePath: ".yama/memory"
  # Maximum word count for condensed memory per repository (default: 50)
  maxWords: 200
  # prompt: "Your custom condensation prompt here..."
  # neurolink:
  #   provider: google-ai
  #   model: gemini-2.0-flash
  #   temperature: 0.1
  autoCommit: true # Auto-commit memory files to repo after each review (persists across CI builds)
  # commitMessage: "chore: update yama review memory [skip ci]"

# ============================================================================
# Project-Specific Standards (Override in your repository)
# ============================================================================
projectStandards:
  # Path to project-specific prompt files (relative to repo root)
  customPromptsPath: "config/prompts/"

  # Additional focus areas beyond defaults
  additionalFocusAreas: []

  # Custom blocking rules
  customBlockingRules: []

  # Severity level overrides
  severityOverrides: {}

# ============================================================================
# Monitoring & Analytics
# ============================================================================
monitoring:
  enabled: true
  logToolCalls: true # Log every MCP tool execution
  logAIDecisions: true # Log AI decision points
  logTokenUsage: true # Log token usage for cost tracking
  exportFormat: "json" # json | csv
  exportPath: ".yama/analytics/"

# ============================================================================
# Performance & Cost Controls
# ============================================================================
performance:
  maxReviewDuration: "15m" # Kill switch for long reviews

  tokenBudget:
    maxTokensPerReview: 500000 # Hard limit on tokens
    warningThreshold: 400000 # Warn when approaching limit

  costControls:
    maxCostPerReview: 2.0 # USD limit per review
    warningThreshold: 1.5 # Warn at $1.50

# ============================================================================
# v3 additions (all optional — defaults shown)
# ============================================================================

# Cross-run review state: makes re-reviews incremental (no duplicate comments,
# fixed findings resolved, repeatedly-ignored findings auto-suppressed).
# store: file | inline | github-artifact | jenkins-artifact
# The CI-artifact stores wrap the file store — your workflow moves the state
# file across runs (actions/upload-artifact / archiveArtifacts).
# state:
#   enabled: true
#   store: file
#   path: .yama/state

# Finding verification before posting (the submit_review gate):
#   off    — dedup only
#   basic  — tools-off critic pass kills incoherent/inflated/evidence-free findings
#   strict — critic + code evidence check; uncertain findings are rejected
# review:
#   verification: basic

# Agentic-loop guards (previously decorative, now enforced):
# performance:
#   loop:
#     maxSteps: 100          # tool-loop step cap per generate() call
#     toolTimeoutMs: 300000  # per-tool-call timeout
#     # turnTimeoutMs: 900000  # whole-turn cap (defaults to maxReviewDuration)
#     # stallTimeoutMs: 120000 # no-progress watchdog

# Context management (NeuroLink):
# ai:
#   conversationMemory:
#     contextCompaction:
#       enabled: true        # auto-compact at 80% of the model context window
#       threshold: 0.8
#   mcpOutputLimits:
#     strategy: externalize  # page oversized tool outputs (huge diffs) on demand
#     maxBytes: 100000
#     warnBytes: 50000

# Team rules live in .yama/rules/**/*.yaml — see .yama/rules/example.yaml
# (scaffolded by `yama init`). Findings cite rules via their `rule` field;
# violated blocking rules force the verdict to BLOCKED.
