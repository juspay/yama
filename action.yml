name: "Yama PR Review"
description: "AI-powered PR review for GitHub with MCP tools"
author: "Juspay Technologies"

branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token used by the GitHub MCP server for API access"
    required: false
    default: ${{ github.token }}
  config-path:
    description: "Path to the Yama config file"
    required: false
  dry-run:
    description: "Run the review without posting comments or submitting the review"
    required: false
    default: "false"
  ai-provider:
    description: "AI provider to use (e.g. anthropic, openai, google-ai)"
    required: false
  ai-model:
    description: "Model name for the selected AI provider"
    required: false
  explore-model:
    description: "Smaller/faster model for the explore + verification subagents (defaults to ai-model)"
    required: false
  anthropic-api-key:
    description: "Anthropic API key (used when ai-provider: anthropic)"
    required: false
  openai-api-key:
    description: "OpenAI API key (used when ai-provider: openai)"
    required: false
  google-ai-api-key:
    description: "Google AI Studio API key (used when ai-provider: google-ai)"
    required: false
  google-vertex-project:
    description: "GCP project ID for Vertex AI (auto-derived from the credentials JSON when omitted)"
    required: false
  google-vertex-location:
    description: "Vertex AI location/region"
    required: false
    default: "us-central1"
  google-application-credentials:
    description: "Vertex AI service-account credentials JSON content (written to a temp file at runtime)"
    required: false
  litellm-base-url:
    description: "LiteLLM proxy base URL (used when ai-provider: litellm)"
    required: false
  litellm-api-key:
    description: "LiteLLM proxy API key (used when ai-provider: litellm)"
    required: false
  focus-areas:
    description: "Comma-separated focus areas for the review (e.g. security,performance)"
    required: false
  custom-prompt:
    description: "Additional custom prompt instructions for the review"
    required: false
  verbose:
    description: "Enable verbose logging"
    required: false
    default: "false"
  skip-description-enhance:
    description: "Run the review only and skip PR description enhancement"
    required: false
    default: "false"
  fail-on-blocked:
    description: "Fail the check when the review verdict is BLOCKED. Set to 'false' for advisory mode: the verdict summary comment and outputs are still produced, but the check stays green. Infrastructure failures always fail the check."
    required: false
    default: "true"

outputs:
  decision:
    description: "Review decision (APPROVED, CHANGES_REQUESTED, or BLOCKED)"
    value: ${{ steps.review.outputs.decision }}
  summary:
    description: "Review summary text"
    value: ${{ steps.review.outputs.summary }}
  findings:
    description: "Markdown list of the findings behind the verdict (the reasons for a block)"
    value: ${{ steps.review.outputs.findings }}
  critical-issues:
    description: "Number of critical issues found"
    value: ${{ steps.review.outputs.critical-issues }}
  major-issues:
    description: "Number of major issues found"
    value: ${{ steps.review.outputs.major-issues }}
  minor-issues:
    description: "Number of minor issues found"
    value: ${{ steps.review.outputs.minor-issues }}
  total-comments:
    description: "Total number of inline comments posted by the review"
    value: ${{ steps.review.outputs.total-comments }}

# Composite action that runs the built Yama CLI (`node dist/cli/cli.js review`)
# with the GitHub PR context wired through environment variables and CLI flags.
#
# Why composite instead of a bundled `node20`/`node24` JavaScript action:
# The orchestrator depends on @juspay/neurolink, whose dependency tree has
# proven hostile to static bundling with `ncc` (an earlier `undici` 5.x pin
# failed outright on a missing `interceptors` export; the repo now pins
# `undici` to ~7.22.0 via pnpm overrides). Marking such deps `--external`
# would build but ship a runner missing them at runtime (bundled actions get
# no `npm install`). A bundled action also runs on the runner's fixed Node
# version, while NeuroLink's memory layer needs `node:sqlite` (see the
# setup-node step below). Running the already-built CLI via a composite action
# avoids the bundler entirely while preserving full review behavior and parity
# with the CLI path.
runs:
  using: "composite"
  steps:
    # Pin pnpm to the version that generated pnpm-lock.yaml. Bare `corepack
    # enable` picks an arbitrary pnpm whose `overrides` serialization differs
    # from the lockfile (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on frozen install).
    - name: Set up pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 10.14.0

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # Node 26: NeuroLink's memory layer requires the `node:sqlite` built-in,
        # which does not exist on Node 20 and is flag-gated on Node 22
        # (unflagged from Node 24; the Action runs Node 26, matching CI).
        # actions/setup-node downloads and provisions this version on any
        # runner, so it does not depend on the runner's pre-installed Node.
        node-version: "26"

    - name: Install dependencies and build CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f "dist/cli/cli.js" ]; then
          pnpm install --frozen-lockfile
          pnpm run build
        fi

    - name: Run Yama review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # GitHub MCP server authenticates via the token. We forward it under a
        # NON-RESERVED name (YAMA_GITHUB_TOKEN) as well as GITHUB_TOKEN: inside a
        # composite action `GITHUB_TOKEN` is a reserved name whose value can be
        # clobbered by the runner's automatic token, so `${YAMA_GITHUB_TOKEN}`
        # (referenced by the MCP config) is the reliable one. GITHUB_TOKEN is
        # kept for git operations / backward compatibility.
        YAMA_GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Surface AI provider/model selection to the orchestrator + NeuroLink.
        # Yama's ConfigLoader reads AI_PROVIDER/AI_MODEL; NeuroLink's own provider
        # factory keys off NEUROLINK_PROVIDER/NEUROLINK_MODEL (defaults to 'vertex'
        # otherwise). Set both so provider selection is unambiguous — this mirrors
        # the proven euler-api-dashboard Jenkins setup.
        AI_PROVIDER: ${{ inputs.ai-provider }}
        AI_MODEL: ${{ inputs.ai-model }}
        NEUROLINK_PROVIDER: ${{ inputs.ai-provider }}
        NEUROLINK_MODEL: ${{ inputs.ai-model }}
        # The explore/bootstrap subagent should use the same provider/model as the
        # main review (otherwise it falls back to a config default like vertex and
        # fails when only one provider's credentials are present).
        AI_EXPLORE_PROVIDER: ${{ inputs.ai-provider }}
        AI_EXPLORE_MODEL: ${{ inputs.explore-model || inputs.ai-model }}
        # AI provider credentials (pass the one matching ai-provider). Forwarded
        # as env explicitly because step-level env does NOT propagate into a
        # composite action's steps.
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GOOGLE_AI_API_KEY: ${{ inputs.google-ai-api-key }}
        GOOGLE_VERTEX_PROJECT: ${{ inputs.google-vertex-project }}
        GOOGLE_VERTEX_LOCATION: ${{ inputs.google-vertex-location }}
        VERTEX_CREDENTIALS_JSON: ${{ inputs.google-application-credentials }}
        # LiteLLM proxy (self-hosted / custom models). LITELLM_MODEL mirrors
        # ai-model so NeuroLink's litellm provider resolves the right model.
        LITELLM_BASE_URL: ${{ inputs.litellm-base-url }}
        LITELLM_API_KEY: ${{ inputs.litellm-api-key }}
        LITELLM_MODEL: ${{ inputs.ai-model }}
        # GitHub PR context, consumed by ProviderDetector + the review request.
        YAMA_ACTION_PATH: ${{ github.action_path }}
        EVENT_PATH: ${{ github.event_path }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_FULL: ${{ github.repository }}
        CONFIG_PATH: ${{ inputs.config-path }}
        FOCUS_AREAS: ${{ inputs.focus-areas }}
        CUSTOM_PROMPT: ${{ inputs.custom-prompt }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERBOSE: ${{ inputs.verbose }}
        SKIP_DESC_ENHANCE: ${{ inputs.skip-description-enhance }}
      run: |
        set -euo pipefail

        # Resolve PR number from the event payload.
        PR_NUMBER="$(node -e 'try{const e=require(process.env.EVENT_PATH);const n=(e.pull_request&&e.pull_request.number)||(e.issue&&e.issue.number);process.stdout.write(n?String(n):"")}catch(_){process.stdout.write("")}')"

        if [ -z "$PR_NUMBER" ]; then
          echo "::warning::Action triggered outside of a pull request context. Skipping review."
          echo "decision=SKIPPED" >> "$GITHUB_OUTPUT"
          echo "summary=Not a pull request event" >> "$GITHUB_OUTPUT"
          echo "critical-issues=0" >> "$GITHUB_OUTPUT"
          echo "major-issues=0" >> "$GITHUB_OUTPUT"
          echo "minor-issues=0" >> "$GITHUB_OUTPUT"
          echo "total-comments=0" >> "$GITHUB_OUTPUT"
          echo "exit-code=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

        OWNER="${REPO_FULL%%/*}"
        REPO="${REPO_FULL#*/}"

        # Vertex AI: materialize the service-account JSON to a temp file and
        # point GOOGLE_APPLICATION_CREDENTIALS at it (NeuroLink uses ADC). The
        # GCP project is derived from the JSON's project_id when not supplied.
        if [ -n "${VERTEX_CREDENTIALS_JSON:-}" ]; then
          CRED_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/vertex-creds-XXXXXX.json")"
          # Delete the materialized service-account key when this step exits
          # (success OR failure), so the credentials are never left on the runner.
          trap 'rm -f "$CRED_FILE"' EXIT
          # Write the secret from the environment via node — it is never passed
          # as a shell/process argument, so it cannot appear in a process listing.
          node -e 'require("fs").writeFileSync(process.argv[1], process.env.VERTEX_CREDENTIALS_JSON || "")' "$CRED_FILE"
          chmod 600 "$CRED_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CRED_FILE"
          if [ -z "${GOOGLE_VERTEX_PROJECT:-}" ]; then
            GOOGLE_VERTEX_PROJECT="$(node -e 'try{process.stdout.write(JSON.parse(require("fs").readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,"utf8")).project_id||"")}catch(_){process.stdout.write("")}')"
            export GOOGLE_VERTEX_PROJECT
            if [ -z "${GOOGLE_VERTEX_PROJECT}" ]; then
              echo "::warning::Could not derive GOOGLE_VERTEX_PROJECT from the credentials JSON (missing or unreadable project_id). Pass the google-vertex-project input explicitly when using the Vertex provider."
            fi
          fi
        fi

        ARGS=(review --owner "$OWNER" --repo "$REPO" --pr "$PR_NUMBER")

        [ -n "${CONFIG_PATH}" ] && ARGS+=(--config "$CONFIG_PATH")
        [ -n "${FOCUS_AREAS}" ] && ARGS+=(--focus "$FOCUS_AREAS")
        [ -n "${CUSTOM_PROMPT}" ] && ARGS+=(--prompt "$CUSTOM_PROMPT")
        [ "${SKIP_DESC_ENHANCE}" = "true" ] && ARGS+=(--review-only)
        [ "${DRY_RUN}" = "true" ] && ARGS+=(--dry-run)
        [ "${VERBOSE}" = "true" ] && ARGS+=(--verbose)

        echo "::group::Yama review (PR #$PR_NUMBER in $OWNER/$REPO)"
        STATUS=0
        node "$YAMA_ACTION_PATH/dist/cli/cli.js" "${ARGS[@]}" || STATUS=$?
        echo "::endgroup::"

        # Defer the pass/fail decision to the "Enforce verdict" step so the
        # verdict summary comment is posted even when the check must fail.
        echo "exit-code=$STATUS" >> "$GITHUB_OUTPUT"

    # A blocking verdict must never be invisible. The agent posts inline
    # comments itself, but when it fails to (or the findings lack detail) the
    # check would otherwise go red with no explanation on the PR — so this
    # deterministic step publishes the verdict + findings as one idempotent,
    # marker-keyed comment whenever the review did not approve.
    - name: Post verdict summary comment
      if: ${{ !cancelled() && inputs.dry-run != 'true' && steps.review.outputs.pr-number != '' && (steps.review.outputs.decision == 'BLOCKED' || steps.review.outputs.decision == 'CHANGES_REQUESTED') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO_FULL: ${{ github.repository }}
        PR_NUMBER: ${{ steps.review.outputs.pr-number }}
        DECISION: ${{ steps.review.outputs.decision }}
        SUMMARY: ${{ steps.review.outputs.summary }}
        FINDINGS: ${{ steps.review.outputs.findings }}
        CRITICAL: ${{ steps.review.outputs.critical-issues }}
        MAJOR: ${{ steps.review.outputs.major-issues }}
        MINOR: ${{ steps.review.outputs.minor-issues }}
      run: |
        set -euo pipefail
        MARKER="<!-- yama-verdict-summary -->"
        BODY_FILE="$(mktemp)"
        {
          echo "$MARKER"
          echo "## 🛡️ Yama Review Verdict: $DECISION"
          echo
          echo "Severity counts — 🔒 CRITICAL: ${CRITICAL:-0} · ⚠️ MAJOR: ${MAJOR:-0} · 💡 MINOR: ${MINOR:-0}"
          echo
          if [ -n "${SUMMARY:-}" ]; then
            printf '%s\n\n' "$SUMMARY"
          fi
          if [ -n "${FINDINGS:-}" ]; then
            echo "### Findings behind this verdict"
            printf '%s\n' "$FINDINGS"
          else
            echo "_The verdict reported findings but carried no detail — treat it as unverified and re-run the review or inspect manually._"
          fi
        } > "$BODY_FILE"

        EXISTING_ID="$(gh api "repos/${REPO_FULL}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- yama-verdict-summary -->")) | .id' 2>/dev/null | head -n1 || true)"
        if [ -n "$EXISTING_ID" ]; then
          gh api -X PATCH "repos/${REPO_FULL}/issues/comments/${EXISTING_ID}" -F body=@"$BODY_FILE" >/dev/null
          echo "Updated existing verdict comment (id ${EXISTING_ID})."
        else
          gh api -X POST "repos/${REPO_FULL}/issues/${PR_NUMBER}/comments" -F body=@"$BODY_FILE" >/dev/null
          echo "Posted verdict comment."
        fi

    # Verdict-aware exit. Infrastructure failures (nonzero exit without a
    # BLOCKED verdict) are always fatal. A BLOCKED verdict fails the check
    # unless fail-on-blocked is 'false' (advisory mode: verdict comment and
    # outputs only, check stays green).
    - name: Enforce verdict
      if: ${{ !cancelled() }}
      shell: bash
      env:
        STATUS: ${{ steps.review.outputs.exit-code }}
        DECISION: ${{ steps.review.outputs.decision }}
        FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
      run: |
        STATUS="${STATUS:-0}"
        if [ "$STATUS" = "0" ]; then
          exit 0
        fi
        if [ "$DECISION" = "BLOCKED" ] && [ "$FAIL_ON_BLOCKED" = "false" ]; then
          echo "::notice::Yama verdict is BLOCKED, but fail-on-blocked is 'false' — advisory mode, the check stays green. See the verdict summary comment on the PR for the reasons."
          exit 0
        fi
        exit "$STATUS"
