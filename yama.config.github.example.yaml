version: 2
configType: "yama"

ai:
  provider: anthropic
  model: claude-opus-4-1
  temperature: 0.7
  maxTokens: 4096

# Yama ships ZERO built-in MCP servers — this block is what gives the reviewer
# its tools. Every server is an entry under `mcpServers.servers.<id>`; the
# legacy flat `mcpServers.github` shape is rejected at startup with a
# ConfigurationError (see MIGRATION.md).
mcpServers:
  servers:
    github:
      enabled: true
      # "http" = GitHub's hosted remote MCP server. Use "stdio" (with
      # command/args) only for a self-hosted / Docker GitHub MCP server.
      transport: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        # In the GitHub Action, YAMA_GITHUB_TOKEN is forwarded from the
        # `github-token` input. For local CLI runs, export YAMA_GITHUB_TOKEN
        # (or reference ${GITHUB_TOKEN} here instead).
        Authorization: "Bearer ${YAMA_GITHUB_TOKEN}"
      roles: [review, explore]
      modes: [pr]
      # The hosted endpoint is slow to handshake; a generous timeout + retry
      # prevents spurious "not connected" failures on the first tool call.
      timeout: 30000
      retryConfig:
        maxAttempts: 3
        initialDelay: 1000
        maxDelay: 10000
        backoffMultiplier: 2
      # blockedTools is the ONLY denylist — Yama has no built-in write-block
      # list, so write-safety comes entirely from this config. Removing an
      # entry here re-exposes that tool to the reviewer; keep the full
      # recommended list below intact.
      blockedTools:
        - push_files
        - create_or_update_file
        - create_branch
        - delete_file
        - merge_pull_request

review:
  enabled: true
  # Finding verification before posting: off | basic | strict (default: basic).
  verification: basic
  # focusAreas entries are objects (name / priority / description) — not
  # plain strings.
  focusAreas:
    - name: "Security"
      priority: "CRITICAL"
      description: "Injection, secret handling, auth flaws, unsafe input."
    - name: "Performance"
      priority: "MAJOR"
      description: "N+1 queries, leaks, blocking I/O, algorithmic complexity."
    - name: "Code Quality"
      priority: "MAJOR"
      description: "Error handling, duplication, missing edge cases."
    - name: "Tests & Docs"
      priority: "MINOR"
      description: "New behaviour has tests; public changes reflected in docs."
